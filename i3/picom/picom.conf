# ═══════════════════════════════════════════════════════════════════════════════
#  Backend - Use GLX for better performance
# ═══════════════════════════════════════════════════════════════════════════════
backend = "glx";
glx-no-stencil = true;
glx-copy-from-front = false;
use-damage = true;

# ═══════════════════════════════════════════════════════════════════════════════
#  Shadows - Soft ambient shadows
# ═══════════════════════════════════════════════════════════════════════════════
shadow = true;
shadow-radius = 20;
shadow-opacity = 0.5;
shadow-offset-x = -20;
shadow-offset-y = -20;

# Aurora-tinted shadow (subtle cyan glow for active windows handled separately)
shadow-color = "#000000";

# Exclude shadows from certain windows
shadow-exclude = [
    "name = 'Notification'",
    "class_g = 'Conky'",
    "class_g ?= 'Notify-osd'",
    "class_g = 'Cairo-clock'",
    "class_g = 'slop'",
    "class_g = 'Polybar'",
    "_GTK_FRAME_EXTENTS@:c",
    "_NET_WM_STATE@:32a *= '_NET_WM_STATE_HIDDEN'"
];

# ═══════════════════════════════════════════════════════════════════════════════
#  Fading - Smooth window transitions
# ═══════════════════════════════════════════════════════════════════════════════
fading = true;
fade-in-step = 0.04;
fade-out-step = 0.04;
fade-delta = 5;

# Exclude fading from certain windows
fade-exclude = [
    "class_g = 'slop'"
];

# ═══════════════════════════════════════════════════════════════════════════════
#  Transparency / Opacity
# ═══════════════════════════════════════════════════════════════════════════════
inactive-opacity = 0.95;
active-opacity = 1.0;
frame-opacity = 1.0;
inactive-opacity-override = false;

# Dim inactive windows
inactive-dim = 0.05;

# Window-specific opacity rules
opacity-rule = [
    "95:class_g = 'kitty' && focused",
    "90:class_g = 'kitty' && !focused",
    "95:class_g = 'Alacritty' && focused",
    "90:class_g = 'Alacritty' && !focused",
    "100:class_g = 'firefox'",
    "100:class_g = 'Chromium'",
    "100:class_g = 'Code'",
    "100:class_g = 'Gimp'",
    "100:fullscreen"
];

# Focus-related settings
focus-exclude = [
    "class_g = 'Cairo-clock'",
    "class_g = 'Bar'",
    "class_g = 'slop'"
];

# ═══════════════════════════════════════════════════════════════════════════════
#  Blur - Frosted glass effect
# ═══════════════════════════════════════════════════════════════════════════════
blur: {
    method = "dual_kawase";
    strength = 6;
    background = true;
    background-frame = false;
    background-fixed = false;
};

# Windows to blur behind
blur-background-exclude = [
    "window_type = 'desktop'",
    "window_type = 'utility'",
    "window_type = 'notification'",
    "class_g = 'slop'",
    "class_g = 'Firefox' && argb",
    "name = 'rofi - '",
    "_GTK_FRAME_EXTENTS@:c"
];

# ═══════════════════════════════════════════════════════════════════════════════
#  Rounded Corners
# ═══════════════════════════════════════════════════════════════════════════════
corner-radius = 12;

rounded-corners-exclude = [
    "window_type = 'dock'",
    "window_type = 'desktop'",
    "class_g = 'Polybar'",
    "class_g = 'i3bar'"
];

# ═══════════════════════════════════════════════════════════════════════════════
#  Animations (picom-animations fork)
# ═══════════════════════════════════════════════════════════════════════════════
# Uncomment if using picom with animations support
# animations = true;
# animation-stiffness = 200;
# animation-window-mass = 0.5;
# animation-dampening = 20;
# animation-clamping = false;
# animation-for-open-window = "zoom";
# animation-for-unmap-window = "zoom";
# animation-for-transient-window = "slide-up";

# ═══════════════════════════════════════════════════════════════════════════════
#  Window Type Settings
# ═══════════════════════════════════════════════════════════════════════════════
wintypes: {
    tooltip = {
        fade = true;
        shadow = true;
        opacity = 0.95;
        focus = true;
        full-shadow = false;
    };
    dock = {
        shadow = false;
        clip-shadow-above = true;
    };
    dnd = {
        shadow = false;
    };
    popup_menu = {
        opacity = 0.98;
        shadow = true;
    };
    dropdown_menu = {
        opacity = 0.98;
        shadow = true;
    };
    utility = {
        shadow = false;
        opacity = 0.98;
    };
    notification = {
        shadow = true;
        opacity = 1.0;
    };
    dialog = {
        shadow = true;
        opacity = 1.0;
    };
    menu = {
        shadow = true;
        opacity = 0.98;
    };
};

# ═══════════════════════════════════════════════════════════════════════════════
#  VSync and Performance
# ═══════════════════════════════════════════════════════════════════════════════
vsync = true;
mark-wmwin-focused = true;
mark-ovredir-focused = true;
detect-rounded-corners = true;
detect-client-opacity = true;
detect-transient = true;
detect-client-leader = true;
use-ewmh-active-win = true;
unredir-if-possible = false;
log-level = "warn";

# ═══════════════════════════════════════════════════════════════════════════════
#  GLX Backend Options
# ═══════════════════════════════════════════════════════════════════════════════
glx-no-rebind-pixmap = true;
xrender-sync-fence = true;
