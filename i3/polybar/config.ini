;; ═══════════════════════════════════════════════════════════════════════════════
;;  Aurora Color Palette
;; ═══════════════════════════════════════════════════════════════════════════════
[colors]
; Deep space backgrounds
void = #0a0e14
space = #0d1117
nebula = #161b22
cosmic = #21262d
stardust = #30363d

; Text colors
moonlight = #8b949e
starlight = #c9d1d9
plasma = #f0f6fc

; Aurora accents
cyan = #00d4ff
purple = #a855f7
pink = #ec4899
green = #22c55e
yellow = #f59e0b
red = #ef4444

; Transparency
transparent = #00000000
semi-transparent = #cc0d1117

;; ═══════════════════════════════════════════════════════════════════════════════
;;  Main Bar
;; ═══════════════════════════════════════════════════════════════════════════════
[bar/aurora]
monitor = ${env:MONITOR:}
width = 98%
height = 42
offset-x = 1%
offset-y = 10
radius = 12

background = ${colors.semi-transparent}
foreground = ${colors.plasma}

line-size = 0
line-color = ${colors.cyan}

border-size = 2
border-color = ${colors.cosmic}

padding-left = 2
padding-right = 2

module-margin-left = 0
module-margin-right = 0

; Fonts
font-0 = "JetBrains Mono:size=10:weight=medium;3"
font-1 = "JetBrains Mono Nerd Font:size=13;4"
font-2 = "JetBrains Mono Nerd Font:size=18;5"
font-3 = "JetBrains Mono Nerd Font:size=10;3"

; Module layout
modules-left = launcher sep workspaces sep xwindow
modules-center = purma-ai
modules-right = tray sep pulseaudio sep network sep battery sep date sep power

; Tray
tray-position = none

; Interaction
cursor-click = pointer
cursor-scroll = ns-resize

; Window manager
wm-restack = i3
override-redirect = true

enable-ipc = true

;; ═══════════════════════════════════════════════════════════════════════════════
;;  Separators & Decorations
;; ═══════════════════════════════════════════════════════════════════════════════
[module/sep]
type = custom/text
content = "│"
content-foreground = ${colors.stardust}
content-padding = 1

[module/space]
type = custom/text
content = " "

;; ═══════════════════════════════════════════════════════════════════════════════
;;  Left Modules
;; ═══════════════════════════════════════════════════════════════════════════════
[module/launcher]
type = custom/text
content = "%{T3}󰣇%{T-}"
content-foreground = ${colors.cyan}
content-padding = 2
click-left = rofi -show drun -theme ~/.config/rofi/aurora.rasi
click-right = rofi -show run -theme ~/.config/rofi/aurora.rasi

[module/workspaces]
type = internal/i3
pin-workspaces = true
strip-wsnumbers = true
index-sort = true
enable-click = true
enable-scroll = true
wrapping-scroll = false
reverse-scroll = false
fuzzy-match = true

format = <label-state> <label-mode>

; Mode indicator (resize, etc)
label-mode = %mode%
label-mode-padding = 2
label-mode-foreground = ${colors.void}
label-mode-background = ${colors.yellow}

; Active workspace
label-focused = %{T2}%{T-}
label-focused-foreground = ${colors.cyan}
label-focused-padding = 1

; Inactive workspace
label-unfocused = %{T2}%{T-}
label-unfocused-foreground = ${colors.stardust}
label-unfocused-padding = 1

; Visible (multi-monitor)
label-visible = %{T2}%{T-}
label-visible-foreground = ${colors.purple}
label-visible-padding = 1

; Urgent workspace
label-urgent = %{T2}%{T-}
label-urgent-foreground = ${colors.red}
label-urgent-padding = 1

[module/xwindow]
type = internal/xwindow
label = %title:0:40:...%
label-foreground = ${colors.moonlight}
label-padding = 2

;; ═══════════════════════════════════════════════════════════════════════════════
;;  Center Modules
;; ═══════════════════════════════════════════════════════════════════════════════
[module/purma-ai]
type = custom/text
content = "%{T2}󰚩%{T-}  Purma AI"
content-foreground = ${colors.plasma}
content-background = ${colors.nebula}
content-padding = 3
click-left = ags -r "togglePurmaChat()"
click-right = kitty -e ollama run purma

;; ═══════════════════════════════════════════════════════════════════════════════
;;  Right Modules
;; ═══════════════════════════════════════════════════════════════════════════════
[module/tray]
type = internal/tray
format-margin = 8
tray-spacing = 8
tray-size = 65%

[module/pulseaudio]
type = internal/pulseaudio
use-ui-max = false

format-volume = <ramp-volume> <label-volume>
format-volume-padding = 1

label-volume = %percentage%%
label-volume-foreground = ${colors.starlight}

label-muted = "%{T2}󰝟%{T-} muted"
label-muted-foreground = ${colors.moonlight}
label-muted-padding = 1

ramp-volume-0 = "%{T2}󰕿%{T-}"
ramp-volume-1 = "%{T2}󰖀%{T-}"
ramp-volume-2 = "%{T2}󰕾%{T-}"
ramp-volume-foreground = ${colors.green}

click-right = pavucontrol

[module/network]
type = internal/network
interface-type = wireless
interval = 3

format-connected = <ramp-signal> <label-connected>
format-connected-padding = 1
label-connected = %essid%
label-connected-foreground = ${colors.starlight}

format-disconnected = <label-disconnected>
format-disconnected-padding = 1
label-disconnected = "%{T2}󰤭%{T-} Offline"
label-disconnected-foreground = ${colors.moonlight}

ramp-signal-0 = "%{T2}󰤟%{T-}"
ramp-signal-1 = "%{T2}󰤢%{T-}"
ramp-signal-2 = "%{T2}󰤥%{T-}"
ramp-signal-3 = "%{T2}󰤨%{T-}"
ramp-signal-foreground = ${colors.cyan}

[module/network-wired]
type = internal/network
interface-type = wired
interval = 3

format-connected = <label-connected>
format-connected-padding = 1
label-connected = "%{T2}󰈀%{T-} %linkspeed%"
label-connected-foreground = ${colors.cyan}

format-disconnected = <label-disconnected>
label-disconnected = "%{T2}󰈂%{T-}"
label-disconnected-foreground = ${colors.moonlight}

[module/battery]
type = internal/battery
battery = BAT0
adapter = ADP1
full-at = 98
low-at = 15

format-charging = <animation-charging> <label-charging>
format-charging-padding = 1

format-discharging = <ramp-capacity> <label-discharging>
format-discharging-padding = 1

format-full = <label-full>
format-full-padding = 1
label-full = "%{T2}󰁹%{T-} 100%"
label-full-foreground = ${colors.green}

format-low = <animation-low> <label-low>
format-low-padding = 1
label-low = "%percentage%%"
label-low-foreground = ${colors.red}

label-charging = %percentage%%
label-charging-foreground = ${colors.yellow}

label-discharging = %percentage%%
label-discharging-foreground = ${colors.starlight}

ramp-capacity-0 = "%{T2}󰁺%{T-}"
ramp-capacity-0-foreground = ${colors.red}
ramp-capacity-1 = "%{T2}󰁻%{T-}"
ramp-capacity-1-foreground = ${colors.yellow}
ramp-capacity-2 = "%{T2}󰁼%{T-}"
ramp-capacity-3 = "%{T2}󰁽%{T-}"
ramp-capacity-4 = "%{T2}󰁾%{T-}"
ramp-capacity-5 = "%{T2}󰁿%{T-}"
ramp-capacity-6 = "%{T2}󰂀%{T-}"
ramp-capacity-7 = "%{T2}󰂁%{T-}"
ramp-capacity-8 = "%{T2}󰂂%{T-}"
ramp-capacity-9 = "%{T2}󰁹%{T-}"
ramp-capacity-foreground = ${colors.green}

animation-charging-0 = "%{T2}󰢜%{T-}"
animation-charging-1 = "%{T2}󰂆%{T-}"
animation-charging-2 = "%{T2}󰂇%{T-}"
animation-charging-3 = "%{T2}󰂈%{T-}"
animation-charging-4 = "%{T2}󰢝%{T-}"
animation-charging-5 = "%{T2}󰂉%{T-}"
animation-charging-6 = "%{T2}󰢞%{T-}"
animation-charging-7 = "%{T2}󰂊%{T-}"
animation-charging-8 = "%{T2}󰂋%{T-}"
animation-charging-9 = "%{T2}󰂅%{T-}"
animation-charging-foreground = ${colors.yellow}
animation-charging-framerate = 500

animation-low-0 = "%{T2}󰂃%{T-}"
animation-low-1 = "%{T2}󰁺%{T-}"
animation-low-foreground = ${colors.red}
animation-low-framerate = 500

[module/date]
type = internal/date
interval = 1

date = "%a %d"
time = "%H:%M"

format = <label>
format-padding = 2
format-background = ${colors.nebula}

label = "%{T2}󰥔%{T-}  %date%  %time%"
label-foreground = ${colors.plasma}

click-left = gnome-calendar

[module/power]
type = custom/text
content = "%{T2}󰐥%{T-}"
content-foreground = ${colors.red}
content-padding = 2
click-left = rofi -show power-menu -modi "power-menu:~/.config/rofi/scripts/power-menu.sh" -theme ~/.config/rofi/aurora-power.rasi

;; ═══════════════════════════════════════════════════════════════════════════════
;;  Additional Modules
;; ═══════════════════════════════════════════════════════════════════════════════
[module/cpu]
type = internal/cpu
interval = 2
format = <label>
format-padding = 1
label = "%{T2}󰻠%{T-} %percentage%%"
label-foreground = ${colors.purple}

[module/memory]
type = internal/memory
interval = 2
format = <label>
format-padding = 1
label = "%{T2}󰍛%{T-} %percentage_used%%"
label-foreground = ${colors.cyan}

[module/temperature]
type = internal/temperature
thermal-zone = 0
warn-temperature = 70

format = <ramp> <label>
format-padding = 1
format-warn = <ramp> <label-warn>

label = %temperature-c%
label-warn = %temperature-c%
label-warn-foreground = ${colors.red}

ramp-0 = "%{T2}󱃃%{T-}"
ramp-0-foreground = ${colors.cyan}
ramp-1 = "%{T2}󰔏%{T-}"
ramp-1-foreground = ${colors.green}
ramp-2 = "%{T2}󱃂%{T-}"
ramp-2-foreground = ${colors.yellow}
ramp-3 = "%{T2}󰸁%{T-}"
ramp-3-foreground = ${colors.red}

[module/backlight]
type = internal/backlight
card = intel_backlight
use-actual-brightness = true
enable-scroll = true

format = <ramp> <label>
format-padding = 1
label = %percentage%%

ramp-0 = "%{T2}󰃞%{T-}"
ramp-1 = "%{T2}󰃟%{T-}"
ramp-2 = "%{T2}󰃠%{T-}"
ramp-foreground = ${colors.yellow}

;; ═══════════════════════════════════════════════════════════════════════════════
;;  Purma Modules
;; ═══════════════════════════════════════════════════════════════════════════════
[module/purma-spaces]
type = custom/script
exec = purma-spaces-ctl status 2>/dev/null || echo "󰊠 Default"
interval = 2
format = <label>
format-padding = 1
label = "%{T2}󰊠%{T-} %output%"
label-foreground = ${colors.purple}
click-left = purma-spaces-ctl toggle
click-right = purma-spaces-ctl menu

[module/purma-pulse]
type = custom/script
exec = curl -s http://localhost:11434/pulse/health 2>/dev/null | jq -r '.level // "unknown"' || echo "offline"
interval = 10
format = <label>
format-padding = 1
label = "%{T2}󰓃%{T-} %output%"
click-left = ags -r "togglePurmaPulse()"

;; ═══════════════════════════════════════════════════════════════════════════════
;;  Settings
;; ═══════════════════════════════════════════════════════════════════════════════
[settings]
screenchange-reload = true
pseudo-transparency = true

[global/wm]
margin-top = 0
margin-bottom = 0
