<?xml version="1.0" encoding="UTF-8"?>
<svg width="800" height="400" viewBox="0 0 800 400" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Gradient for sky -->
    <linearGradient id="skyGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#0d1117;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#161b22;stop-opacity:1" />
    </linearGradient>

    <!-- Gradient for mountains -->
    <linearGradient id="mountainGradient1" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#a855f7;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#6b21a8;stop-opacity:1" />
    </linearGradient>

    <linearGradient id="mountainGradient2" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#00d4ff;stop-opacity:0.8" />
      <stop offset="100%" style="stop-color:#0891b2;stop-opacity:0.6" />
    </linearGradient>

    <linearGradient id="mountainGradient3" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#22c55e;stop-opacity:0.6" />
      <stop offset="100%" style="stop-color:#15803d;stop-opacity:0.4" />
    </linearGradient>

    <!-- Glow effect -->
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Star glow -->
    <filter id="starGlow">
      <feGaussianBlur stdDeviation="1.5" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="400" fill="url(#skyGradient)"/>

  <!-- Stars -->
  <g fill="#ffffff" filter="url(#starGlow)">
    <circle cx="50" cy="40" r="1.5" opacity="0.8"/>
    <circle cx="120" cy="70" r="1" opacity="0.6"/>
    <circle cx="200" cy="30" r="1.2" opacity="0.7"/>
    <circle cx="280" cy="80" r="1" opacity="0.5"/>
    <circle cx="350" cy="45" r="1.5" opacity="0.8"/>
    <circle cx="450" cy="60" r="1" opacity="0.6"/>
    <circle cx="520" cy="35" r="1.3" opacity="0.7"/>
    <circle cx="600" cy="75" r="1" opacity="0.5"/>
    <circle cx="680" cy="50" r="1.5" opacity="0.8"/>
    <circle cx="750" cy="40" r="1.2" opacity="0.7"/>
    <circle cx="100" cy="100" r="1" opacity="0.4"/>
    <circle cx="400" cy="90" r="1.2" opacity="0.5"/>
    <circle cx="700" cy="95" r="1" opacity="0.4"/>
  </g>

  <!-- Back mountain range (green/dark) -->
  <polygon
    points="0,400 0,280 80,220 150,260 220,180 300,230 380,150 450,200 520,140 600,190 680,130 750,180 800,160 800,400"
    fill="url(#mountainGradient3)"
  />

  <!-- Middle mountain range (cyan) -->
  <polygon
    points="0,400 0,300 100,250 180,280 260,200 340,250 420,180 500,220 580,160 660,210 740,170 800,200 800,400"
    fill="url(#mountainGradient2)"
  />

  <!-- Front mountain range (purple) - Main Andes -->
  <polygon
    points="0,400 0,320 60,290 120,310 180,260 240,290 300,220 360,260 400,180 440,220 500,250 560,210 620,250 680,200 740,240 800,280 800,400"
    fill="url(#mountainGradient1)"
  />

  <!-- Snow caps -->
  <g fill="#ffffff" opacity="0.9">
    <polygon points="400,180 385,210 415,210"/>
    <polygon points="300,220 288,245 312,245"/>
    <polygon points="680,200 668,225 692,225"/>
    <polygon points="520,140 505,170 535,170"/>
    <polygon points="220,180 205,210 235,210"/>
  </g>

  <!-- AI Circuit lines on mountain -->
  <g stroke="#00d4ff" stroke-width="1" fill="none" opacity="0.4">
    <path d="M400,180 L400,220 L450,220"/>
    <path d="M300,220 L300,260 L350,260"/>
    <path d="M680,200 L680,240 L630,240"/>
    <circle cx="400" cy="220" r="3" fill="#00d4ff"/>
    <circle cx="300" cy="260" r="3" fill="#00d4ff"/>
    <circle cx="680" cy="240" r="3" fill="#00d4ff"/>
  </g>

  <!-- Title: PURMA -->
  <text x="400" y="320"
        font-family="'Segoe UI', Arial, sans-serif"
        font-size="72"
        font-weight="bold"
        fill="#00d4ff"
        text-anchor="middle"
        filter="url(#glow)">
    PURMA
  </text>

  <!-- Subtitle: LINUX -->
  <text x="400" y="360"
        font-family="'Segoe UI', Arial, sans-serif"
        font-size="28"
        font-weight="300"
        fill="#8b949e"
        text-anchor="middle"
        letter-spacing="12">
    LINUX
  </text>

  <!-- Tagline -->
  <text x="400" y="388"
        font-family="'Segoe UI', Arial, sans-serif"
        font-size="14"
        fill="#a855f7"
        text-anchor="middle"
        font-style="italic">
    Local AI-First Distribution
  </text>
</svg>
