# ═══════════════════════════════════════════════════════════════════════════════
#  Font Configuration
# ═══════════════════════════════════════════════════════════════════════════════
font_family      JetBrains Mono
bold_font        JetBrains Mono Bold
italic_font      JetBrains Mono Italic
bold_italic_font JetBrains Mono Bold Italic
font_size        11.0

# Adjust line height and letter spacing
adjust_line_height  110%
adjust_column_width 0

# Disable ligatures (optional, uncomment to enable)
# disable_ligatures never

# ═══════════════════════════════════════════════════════════════════════════════
#  Cursor
# ═══════════════════════════════════════════════════════════════════════════════
cursor_shape          beam
cursor_beam_thickness 2
cursor_blink_interval 0.5
cursor_stop_blinking_after 0

# ═══════════════════════════════════════════════════════════════════════════════
#  Scrollback
# ═══════════════════════════════════════════════════════════════════════════════
scrollback_lines 10000
scrollback_pager less --chop-long-lines --RAW-CONTROL-CHARS +INPUT_LINE_NUMBER
wheel_scroll_multiplier 5.0
touch_scroll_multiplier 1.0

# ═══════════════════════════════════════════════════════════════════════════════
#  Window Layout
# ═══════════════════════════════════════════════════════════════════════════════
remember_window_size  no
initial_window_width  1000
initial_window_height 650
window_padding_width  16
window_margin_width   0
single_window_margin_width -1

# Window decorations
hide_window_decorations yes
window_border_width     0

# Confirm on close
confirm_os_window_close 0

# ═══════════════════════════════════════════════════════════════════════════════
#  Tab Bar
# ═══════════════════════════════════════════════════════════════════════════════
tab_bar_edge            top
tab_bar_style           powerline
tab_powerline_style     slanted
tab_bar_min_tabs        2
tab_title_template      "{index}: {title}"
active_tab_title_template "{index}: {title}"

# ═══════════════════════════════════════════════════════════════════════════════
#  Aurora Color Scheme
# ═══════════════════════════════════════════════════════════════════════════════

# Background and foreground
foreground              #f0f6fc
background              #0a0e14
background_opacity      0.95
background_blur         32

# Selection
selection_foreground    #0a0e14
selection_background    #00d4ff

# Cursor
cursor                  #00d4ff
cursor_text_color       #0a0e14

# URL underline color
url_color               #00d4ff
url_style               curly

# Tab bar colors
active_tab_foreground   #0a0e14
active_tab_background   #00d4ff
active_tab_font_style   bold
inactive_tab_foreground #8b949e
inactive_tab_background #161b22
inactive_tab_font_style normal
tab_bar_background      #0d1117
tab_bar_margin_color    #0d1117

# Window borders
active_border_color     #00d4ff
inactive_border_color   #21262d
bell_border_color       #ef4444

# ═══════════════════════════════════════════════════════════════════════════════
#  16 Color Palette - Aurora
# ═══════════════════════════════════════════════════════════════════════════════

# Black (dark backgrounds)
color0  #0d1117
color8  #30363d

# Red
color1  #ef4444
color9  #f87171

# Green
color2  #22c55e
color10 #4ade80

# Yellow
color3  #f59e0b
color11 #fbbf24

# Blue
color4  #00d4ff
color12 #38bdf8

# Magenta/Purple
color5  #a855f7
color13 #c084fc

# Cyan
color6  #06b6d4
color14 #22d3ee

# White (light foregrounds)
color7  #c9d1d9
color15 #f0f6fc

# ═══════════════════════════════════════════════════════════════════════════════
#  Marks
# ═══════════════════════════════════════════════════════════════════════════════
mark1_foreground #0a0e14
mark1_background #a855f7
mark2_foreground #0a0e14
mark2_background #00d4ff
mark3_foreground #0a0e14
mark3_background #22c55e

# ═══════════════════════════════════════════════════════════════════════════════
#  Bell
# ═══════════════════════════════════════════════════════════════════════════════
enable_audio_bell    no
visual_bell_duration 0.1
visual_bell_color    #ef4444
window_alert_on_bell yes

# ═══════════════════════════════════════════════════════════════════════════════
#  Advanced
# ═══════════════════════════════════════════════════════════════════════════════
shell_integration    enabled
allow_hyperlinks     yes
term                 xterm-kitty

# ═══════════════════════════════════════════════════════════════════════════════
#  Keyboard Shortcuts
# ═══════════════════════════════════════════════════════════════════════════════
# Clear default shortcuts
clear_all_shortcuts no

# Clipboard
map ctrl+shift+c copy_to_clipboard
map ctrl+shift+v paste_from_clipboard

# Scrolling
map ctrl+shift+up    scroll_line_up
map ctrl+shift+down  scroll_line_down
map ctrl+shift+k     scroll_line_up
map ctrl+shift+j     scroll_line_down
map ctrl+shift+page_up scroll_page_up
map ctrl+shift+page_down scroll_page_down
map ctrl+shift+home  scroll_home
map ctrl+shift+end   scroll_end

# Font size
map ctrl+plus       change_font_size all +1.0
map ctrl+minus      change_font_size all -1.0
map ctrl+0          change_font_size all 0

# Windows/Tabs
map ctrl+shift+enter new_window
map ctrl+shift+n     new_os_window
map ctrl+shift+w     close_window
map ctrl+shift+t     new_tab
map ctrl+shift+q     close_tab
map ctrl+shift+right next_tab
map ctrl+shift+left  previous_tab
map ctrl+shift+l     next_layout
map ctrl+tab         next_tab
map ctrl+shift+tab   previous_tab

# Tab navigation
map ctrl+1 goto_tab 1
map ctrl+2 goto_tab 2
map ctrl+3 goto_tab 3
map ctrl+4 goto_tab 4
map ctrl+5 goto_tab 5

# Misc
map ctrl+shift+f5    load_config_file
map ctrl+shift+f11   toggle_fullscreen
map ctrl+shift+u     kitten unicode_input
