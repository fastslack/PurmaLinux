# PurmaLinux - Yazi Configuration
# Terminal file manager con integración AI

[manager]
ratio = [1, 3, 4]
sort_by = "natural"
sort_sensitive = false
sort_reverse = false
sort_dir_first = true
linemode = "size"
show_hidden = false
show_symlink = true

[preview]
tab_size = 2
max_width = 600
max_height = 900
cache_dir = ""
image_filter = "triangle"
image_quality = 75
sixel_fraction = 15
ueberzug_scale = 1
ueberzug_offset = [0, 0, 0, 0]

[opener]
# Folders
folder = [
  { run = 'kitty --directory "$@"', desc = "Open in terminal", for = "linux" },
]

# Text files
edit = [
  { run = '${EDITOR:-nvim} "$@"', desc = "Edit", block = true, for = "linux" },
]

# Images
image = [
  { run = 'feh "$@"', desc = "View image", orphan = true, for = "linux" },
  { run = 'gimp "$@"', desc = "Edit with GIMP", orphan = true, for = "linux" },
]

# Videos
video = [
  { run = 'mpv "$@"', desc = "Play video", orphan = true, for = "linux" },
]

# Audio
audio = [
  { run = 'mpv "$@"', desc = "Play audio", orphan = true, for = "linux" },
]

# PDF
pdf = [
  { run = 'zathura "$@"', desc = "View PDF", orphan = true, for = "linux" },
  { run = 'evince "$@"', desc = "View with Evince", orphan = true, for = "linux" },
]

# Archives
archive = [
  { run = 'file-roller "$@"', desc = "Extract", orphan = true, for = "linux" },
]

# Fallback
fallback = [
  { run = 'xdg-open "$@"', desc = "Open with default", orphan = true, for = "linux" },
]

[open]
rules = [
  # Directories
  { name = "*/", use = ["folder", "edit"] },

  # Text
  { mime = "text/*", use = ["edit"] },
  { mime = "application/json", use = ["edit"] },
  { mime = "application/x-yaml", use = ["edit"] },

  # Images
  { mime = "image/*", use = ["image", "edit"] },

  # Videos
  { mime = "video/*", use = ["video"] },

  # Audio
  { mime = "audio/*", use = ["audio"] },

  # PDF
  { mime = "application/pdf", use = ["pdf"] },

  # Archives
  { mime = "application/zip", use = ["archive"] },
  { mime = "application/x-tar", use = ["archive"] },
  { mime = "application/x-gzip", use = ["archive"] },
  { mime = "application/x-7z-compressed", use = ["archive"] },
  { mime = "application/x-rar", use = ["archive"] },

  # Fallback
  { name = "*", use = ["fallback", "edit"] },
]

[tasks]
micro_workers = 10
macro_workers = 25
bizarre_retry = 5
image_alloc = 536870912
image_bound = [0, 0]
suppress_preload = false

[plugin]
preloaders = [
  # Image
  { mime = "image/{avif,hei?,jxl,svg+xml}", run = "magick" },
  { mime = "image/*", run = "image" },
  # Video
  { mime = "video/*", run = "video" },
  # PDF
  { mime = "application/pdf", run = "pdf" },
  # Font
  { mime = "font/*", run = "font" },
  { mime = "application/vnd.ms-opentype", run = "font" },
]

prepend_previewers = []
append_previewers = []

[input]
# cd
cd_title = "Change directory:"
cd_origin = "top-center"
cd_offset = [0, 2, 50, 3]

# create
create_title = "Create:"
create_origin = "top-center"
create_offset = [0, 2, 50, 3]

# rename
rename_title = "Rename:"
rename_origin = "hovered"
rename_offset = [0, 1, 50, 3]

# trash
trash_title = "Move {n} selected file(s) to trash? (y/N)"
trash_origin = "top-center"
trash_offset = [0, 2, 50, 3]

# delete
delete_title = "Delete {n} selected file(s) permanently? (y/N)"
delete_origin = "top-center"
delete_offset = [0, 2, 50, 3]

# filter
filter_title = "Filter:"
filter_origin = "top-center"
filter_offset = [0, 2, 50, 3]

# find
find_title = ["Find next:", "Find previous:"]
find_origin = "top-center"
find_offset = [0, 2, 50, 3]

# search
search_title = "Search via {n}:"
search_origin = "top-center"
search_offset = [0, 2, 50, 3]

# shell
shell_title = ["Shell:", "Shell (block):"]
shell_origin = "top-center"
shell_offset = [0, 2, 50, 3]

[select]
open_title = "Open with:"
open_origin = "hovered"
open_offset = [0, 1, 50, 7]

[which]
sort_by = "none"
sort_sensitive = false
sort_reverse = false

[log]
enabled = false
