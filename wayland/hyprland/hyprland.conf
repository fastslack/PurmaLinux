# ═══════════════════════════════════════════════════════════════════
# PurmaLinux - Hyprland Configuration
# Theme: Aurora
# ═══════════════════════════════════════════════════════════════════

# ───────────────────────────────────────────────────────────────────
# MONITORS
# ───────────────────────────────────────────────────────────────────
# See https://wiki.hyprland.org/Configuring/Monitors/
monitor=,preferred,auto,1

# ───────────────────────────────────────────────────────────────────
# AUTOSTART
# ───────────────────────────────────────────────────────────────────
exec-once = waybar
exec-once = mako
exec-once = swaybg -i ~/.config/wallpaper.png -m fill
exec-once = /usr/lib/polkit-gnome/polkit-gnome-authentication-agent-1
exec-once = wl-paste --watch cliphist store
exec-once = hypridle

# PurmaLinux AI Server
exec-once = ~/.local/bin/purma-dev server &

# AGS (if using AGS instead of Waybar)
# exec-once = ags

# ───────────────────────────────────────────────────────────────────
# ENVIRONMENT
# ───────────────────────────────────────────────────────────────────
env = XCURSOR_SIZE,24
env = QT_QPA_PLATFORMTHEME,qt5ct
env = QT_QPA_PLATFORM,wayland
env = GDK_BACKEND,wayland,x11
env = SDL_VIDEODRIVER,wayland
env = CLUTTER_BACKEND,wayland
env = XDG_CURRENT_DESKTOP,Hyprland
env = XDG_SESSION_TYPE,wayland
env = XDG_SESSION_DESKTOP,Hyprland

# ───────────────────────────────────────────────────────────────────
# INPUT
# ───────────────────────────────────────────────────────────────────
input {
    kb_layout = us
    kb_variant =
    kb_model =
    kb_options =
    kb_rules =

    follow_mouse = 1
    sensitivity = 0

    touchpad {
        natural_scroll = true
        tap-to-click = true
        drag_lock = true
    }
}

# ───────────────────────────────────────────────────────────────────
# APPEARANCE - AURORA THEME
# ───────────────────────────────────────────────────────────────────
general {
    gaps_in = 6
    gaps_out = 12
    border_size = 2

    # Aurora colors
    col.active_border = rgba(00d4ffee) rgba(a855f7ee) 45deg
    col.inactive_border = rgba(30363daa)

    layout = dwindle
    allow_tearing = false
}

decoration {
    rounding = 12

    blur {
        enabled = true
        size = 8
        passes = 2
        new_optimizations = true
        xray = false
    }

    # Shadows
    drop_shadow = true
    shadow_range = 20
    shadow_render_power = 3
    col.shadow = rgba(0a0e14ee)

    # Dim inactive
    dim_inactive = true
    dim_strength = 0.1

    # Active opacity
    active_opacity = 1.0
    inactive_opacity = 0.95
}

animations {
    enabled = true

    # Animation curves
    bezier = smooth, 0.25, 0.1, 0.25, 1
    bezier = smoothOut, 0.36, 0, 0.66, -0.56
    bezier = smoothIn, 0.25, 1, 0.5, 1
    bezier = overshot, 0.05, 0.9, 0.1, 1.1

    animation = windows, 1, 4, overshot, slide
    animation = windowsOut, 1, 4, smoothOut, slide
    animation = windowsMove, 1, 4, smooth
    animation = border, 1, 10, default
    animation = borderangle, 1, 100, default, loop
    animation = fade, 1, 4, smooth
    animation = workspaces, 1, 5, overshot, slidevert
}

# ───────────────────────────────────────────────────────────────────
# LAYOUTS
# ───────────────────────────────────────────────────────────────────
dwindle {
    pseudotile = true
    preserve_split = true
    smart_split = false
    smart_resizing = true
}

master {
    new_status = master
}

misc {
    force_default_wallpaper = 0
    disable_hyprland_logo = true
    disable_splash_rendering = true
    mouse_move_enables_dpms = true
    key_press_enables_dpms = true
}

# ───────────────────────────────────────────────────────────────────
# WINDOW RULES
# ───────────────────────────────────────────────────────────────────
# Floating windows
windowrule = float, ^(pavucontrol)$
windowrule = float, ^(nm-connection-editor)$
windowrule = float, ^(thunar)$
windowrule = float, title:^(btop)$
windowrule = float, title:^(purma-chat)$

# PurmaLinux widgets
windowrule = float, ^(purma-.*)$
windowrule = pin, ^(purma-.*)$

# Size constraints
windowrule = size 800 600, ^(thunar)$
windowrule = size 600 400, ^(pavucontrol)$

# Opacity
windowrule = opacity 0.95, ^(kitty)$
windowrule = opacity 0.95, ^(Code)$

# ───────────────────────────────────────────────────────────────────
# KEYBINDINGS
# ───────────────────────────────────────────────────────────────────
$mainMod = SUPER

# ─── Essential ───
bind = $mainMod, Return, exec, kitty
bind = $mainMod, Q, killactive,
bind = $mainMod SHIFT, Q, exit,
bind = $mainMod, D, exec, wofi --show drun
bind = $mainMod, Space, togglefloating,
bind = $mainMod, M, fullscreen, 1
bind = $mainMod SHIFT, M, fullscreen, 0
bind = $mainMod, P, pseudo,
bind = $mainMod, J, togglesplit,

# ─── PurmaLinux AI Suite ───
bind = $mainMod, A, exec, ~/.local/bin/purma-chat-toggle    # Purma Chat
bind = $mainMod SHIFT, A, exec, kitty --title purma-chat -e purma-dev chat
bind = $mainMod, O, exec, ~/.local/bin/purma-spaces         # Purma Spaces
bind = $mainMod, F, exec, ~/.local/bin/purma-flow           # Purma Flow
bind = $mainMod, B, exec, ~/.local/bin/purma-bridge         # Purma Bridge
bind = $mainMod SHIFT, P, exec, kitty --title btop -e btop  # Purma Pulse (btop)
bind = $mainMod, Y, exec, ~/.local/bin/purma-lens           # Purma Lens
bind = $mainMod, V, exec, ~/.local/bin/purma-vault          # Purma Vault
bind = $mainMod, C, exec, ~/.local/bin/purma-scribe         # Purma Scribe
bind = $mainMod, I, exec, ~/.local/bin/purma-brain          # Purma Brain

# ─── Screenshots ───
bind = , Print, exec, grim - | wl-copy
bind = SHIFT, Print, exec, grim -g "$(slurp)" - | wl-copy
bind = $mainMod, Print, exec, grim -g "$(hyprctl activewindow -j | jq -r '"\(.at[0]),\(.at[1]) \(.size[0])x\(.size[1])"')" - | wl-copy
bind = CTRL, Print, exec, grim -g "$(slurp)" ~/Pictures/screenshot-$(date +%Y%m%d-%H%M%S).png

# ─── Window Focus (vim-style) ───
bind = $mainMod, H, movefocus, l
bind = $mainMod, L, movefocus, r
bind = $mainMod, K, movefocus, u
bind = $mainMod, J, movefocus, d

# ─── Window Move ───
bind = $mainMod SHIFT, H, movewindow, l
bind = $mainMod SHIFT, L, movewindow, r
bind = $mainMod SHIFT, K, movewindow, u
bind = $mainMod SHIFT, J, movewindow, d

# ─── Window Resize ───
bind = $mainMod CTRL, H, resizeactive, -50 0
bind = $mainMod CTRL, L, resizeactive, 50 0
bind = $mainMod CTRL, K, resizeactive, 0 -50
bind = $mainMod CTRL, J, resizeactive, 0 50

# ─── Workspaces ───
bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod, 4, workspace, 4
bind = $mainMod, 5, workspace, 5
bind = $mainMod, 6, workspace, 6
bind = $mainMod, 7, workspace, 7
bind = $mainMod, 8, workspace, 8
bind = $mainMod, 9, workspace, 9
bind = $mainMod, 0, workspace, 10

# ─── Move to Workspace ───
bind = $mainMod SHIFT, 1, movetoworkspace, 1
bind = $mainMod SHIFT, 2, movetoworkspace, 2
bind = $mainMod SHIFT, 3, movetoworkspace, 3
bind = $mainMod SHIFT, 4, movetoworkspace, 4
bind = $mainMod SHIFT, 5, movetoworkspace, 5
bind = $mainMod SHIFT, 6, movetoworkspace, 6
bind = $mainMod SHIFT, 7, movetoworkspace, 7
bind = $mainMod SHIFT, 8, movetoworkspace, 8
bind = $mainMod SHIFT, 9, movetoworkspace, 9
bind = $mainMod SHIFT, 0, movetoworkspace, 10

# ─── Special Workspace (Scratchpad) ───
bind = $mainMod, S, togglespecialworkspace, magic
bind = $mainMod SHIFT, S, movetoworkspace, special:magic

# ─── Scroll through workspaces ───
bind = $mainMod, mouse_down, workspace, e+1
bind = $mainMod, mouse_up, workspace, e-1
bind = $mainMod, bracketright, workspace, e+1
bind = $mainMod, bracketleft, workspace, e-1

# ─── Mouse bindings ───
bindm = $mainMod, mouse:272, movewindow
bindm = $mainMod, mouse:273, resizewindow

# ─── Media Keys ───
bind = , XF86AudioRaiseVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%+
bind = , XF86AudioLowerVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
bind = , XF86AudioMute, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
bind = , XF86AudioPlay, exec, playerctl play-pause
bind = , XF86AudioNext, exec, playerctl next
bind = , XF86AudioPrev, exec, playerctl previous

# ─── Brightness ───
bind = , XF86MonBrightnessUp, exec, brightnessctl set +5%
bind = , XF86MonBrightnessDown, exec, brightnessctl set 5%-

# ─── Quick Spaces (PurmaLinux) ───
bind = CTRL $mainMod, 1, exec, ~/.local/bin/purma-spaces activate work
bind = CTRL $mainMod, 2, exec, ~/.local/bin/purma-spaces activate code
bind = CTRL $mainMod, 3, exec, ~/.local/bin/purma-spaces activate focus
bind = CTRL $mainMod, 4, exec, ~/.local/bin/purma-spaces activate gaming

# ─── Lock ───
bind = $mainMod SHIFT, Escape, exec, hyprlock
